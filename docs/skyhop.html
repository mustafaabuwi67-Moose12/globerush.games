<style>
/* GlobeRush chrome shared by every game page (fixed brand colors so it reads the same on every game's background) */
#gr-bar{max-width:64rem;margin:6px auto 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-radius:14px;background:#0E1A33;border:2px solid #000;border-bottom-width:4px;font-family:"Unbounded","Figtree",system-ui,sans-serif}
#gr-bar a{color:#FFF4E6;text-decoration:none}
#gr-bar .gr-home{display:flex;align-items:center;gap:8px;font-size:16px;letter-spacing:-.01em}
#gr-bar .gr-word{font-weight:600}#gr-bar .gr-word b{color:#FF7A4D;font-weight:800}
#gr-bar .gr-all{font-family:system-ui,sans-serif;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:#FF7A4D;color:#1A0D05!important}
#gr-bar a:focus-visible,.gr-card:focus-visible{outline:3px solid #FFC94A;outline-offset:3px}
#gr-more{max-width:64rem;margin:28px auto 8px}
.gr-more-in{padding:18px;border-radius:18px;background:#0E1A33;border:2px solid #000;border-bottom-width:5px;color:#FFF4E6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.gr-more-in h2{margin:0 0 12px;font-family:"Unbounded","Figtree",system-ui,sans-serif;font-size:18px;font-weight:700;color:#FFF4E6}
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.gr-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#17284B;border:2px solid #000;color:#FFF4E6;text-decoration:none;transition:transform .1s,background .15s}
.gr-card:hover{transform:translateY(-2px);background:#1F3563}
.gr-e{font-size:24px;line-height:1}.gr-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.gr-t b{font-size:14px}.gr-t small{font-size:12px;color:#AFC0E4;font-weight:700}
.gr-fine{margin:12px 0 0;font-size:11.5px;color:#AFC0E4}
@media (prefers-reduced-motion:reduce){.gr-card{transition:none}}
</style>

:root{
  --night:#0F1A3A; --night-2:#16244D; --card:#1C2C5C; --card-2:#24386F; --line:rgba(160,190,255,.16);

  --origin:#10B981; --origin-d:#0A8A60;
  --gold:#FACC15; --gold-d:#C79A06;
  --coral:#FF6B6B; --coral-d:#D94848;
  --sky:#38BDF8; --sky-d:#1B8CC4;
  --violet:#8B7CFF;
  --f-display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--fg)}
body{font-family:var(--f-body);font-weight:600;font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px;
  background-image:radial-gradient(900px 520px at 85% -10%,rgba(139,124,255,.22),transparent 60%),radial-gradient(800px 500px at -10% 30%,rgba(56,189,248,.14),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(16,185,129,.12),transparent 60%);
  background-attachment:fixed;min-height:100%}
@media (max-width:767px){body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.display{font-family:var(--f-display)}
.mono{font-family:var(--f-mono)}
.boot{display:flex;align-items:center;justify-content:center;height:60vh;font-family:var(--f-display);font-size:20px;color:var(--gold)}
.kbd{font-family:var(--f-mono);font-size:.86em;font-weight:700;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:6px;padding:.02em .4em;white-space:nowrap}

/* chunky tactile buttons */
.btn{border-radius:16px;border:2px solid transparent;border-bottom-width:5px;font-family:var(--f-display);font-weight:600;letter-spacing:.02em;
  transition:transform .08s ease,border-bottom-width .08s ease,filter .15s ease;cursor:pointer;user-select:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;border-bottom-width:5px;filter:none}
.btn-go{background:var(--origin);border-color:var(--origin-d);color:#05261B}
.btn-gold{background:var(--gold);border-color:var(--gold-d);color:#2B2100}
.btn-sky{background:var(--sky);border-color:var(--sky-d);color:#04223A}
.btn-ghost{background:var(--card);border-color:#0B1430;color:var(--fg)}
.chip{border-radius:999px;border:2px solid #0B1430;border-bottom-width:4px;background:var(--card);transition:transform .08s ease,border-bottom-width .08s}
.chip:active{transform:translateY(2px);border-bottom-width:2px}

@keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-1.2deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-3px) rotate(-.6deg)}80%{transform:translateX(2px)}}
.wiggle{animation:wiggle .5s ease both}
@keyframes pop{0%{transform:translate(-50%,-12px) scale(.6);opacity:0}55%{transform:translate(-50%,0) scale(1.08);opacity:1}75%{transform:translate(-50%,0) scale(.97)}100%{transform:translate(-50%,0) scale(1)}}
.toast{position:absolute;left:50%;top:12px;z-index:20;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bounceIn{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
.bounce-in{animation:bounceIn .45s cubic-bezier(.2,1.3,.4,1) both}

.qpulse{animation:qpulse 1.8s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-3px)}}
.floaty{animation:floaty 2.4s ease-in-out infinite}
.ad-x{background:

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
