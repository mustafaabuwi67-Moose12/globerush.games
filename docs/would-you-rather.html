   AFFILIATE = your fare links. Placeholders: {FROM} {TO} capitals, {from} {to} lowercase

const SITE = {
  url: window.GLOBERUSH.gameUrl("would-you-rather")
};
const AFFILIATE = window.GLOBERUSH && window.GLOBERUSH.affiliate || {
  route: "https://www.skyscanner.com/transport/flights/{from}/{to}/",
  toOnly: "https://www.skyscanner.com/transport/flights-to/{to}/",
  general: "https://www.skyscanner.com/"
};
function fareLink(from, to) {
  const t = from && to ? AFFILIATE.route : to ? AFFILIATE.toOnly : AFFILIATE.general;
  const f = (from || "").trim(),
    d = (to || "").trim();
  return t.replace(/\{FROM\}/g, f.toUpperCase()).replace(/\{TO\}/g, d.toUpperCase()).replace(/\{from\}/g, f.toLowerCase()).replace(/\{to\}/g, d.toLowerCase());
}
