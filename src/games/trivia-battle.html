      <div className="side you"><span className="av" aria-hidden="true">{left.av}</span><div className="min-w-0"><div className="nm">{left.name}</div><div className={`sc tabular-nums ${pulseL ? "ping" : ""}`}>{left.score}</div></div></div>
      <div className="vs">VS</div>
      <div className="side rival"><span className="av" aria-hidden="true">{right.av}</span><div className="min-w-0"><div className="nm">{right.name}</div><div className={`sc tabular-nums ${pulseR ? "ping" : ""}`}>{right.score}</div></div></div>
    </div>
  );
}
function HelpModal({ onClose }) {
  useEffect(() => { const k = e => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-3 backdrop-blur-sm sm:items-center" onClick={onClose} role="dialog" aria-modal="true" aria-label="How to play">
      <div className="pop relative w-full max-w-md rounded-[20px] border-2 border-b-[6px] border-black bg-[color:var(--panel)] p-6" onClick={e => e.stopPropagation()}>
        <button onClick={onClose} className="absolute right-3 top-3 grid h-9 w-9 place-items-center rounded-full text-[color:var(--muted)] hover:bg-white/10" aria-label="Close">✕</button>
        <h2 className="display text-[26px] text-[color:var(--gold)]">How to play</h2>
        <ul className="mt-3 space-y-3 text-[15px]">
          <li className="grid grid-cols-[24px_minmax(0,1fr)] gap-2"><span aria-hidden="true">⚔️</span><p className="min-w-0"><b>Daily battle:</b> face today's rival in {SIZE} travel questions. You get {TIME} seconds each (keys <b>1</b>–<b>4</b>).</p></li>
          <li className="grid grid-cols-[24px_minmax(0,1fr)] gap-2"><span aria-hidden="true">⚡</span><p className="min-w-0">A right answer is worth 50 points, plus up to 50 more for speed. Wrong or too slow: 0.</p></li>
          <li className="grid grid-cols-[24px_minmax(0,1fr)] gap-2"><span aria-hidden="true">👥</span><p className="min-w-0"><b>2 players:</b> pass the phone. Each player answers the same question without peeking.</p></li>
        </ul>
        <button onClick={onClose} className="btn btn-gold mt-5 w-full py-3 text-[17px]">Let's battle</button>
      </div>
    </div>
  );
}

/* One question screen with a running clock. Calls onAnswer(pick | null, secondsLeft). */
function Question({ round, num, onAnswer, sound, rivalTime }) {
  const [left, setLeft] = useState(TIME);
  const [rivalIn, setRivalIn] = useState(false);
  const start = useRef(performance.now()), doneRef = useRef(false);
  useEffect(() => {
    const id = setInterval(() => {
      const l = Math.max(0, TIME - (performance.now() - start.current) / 1000);
      setLeft(l);
      if (rivalTime != null && !rivalIn && TIME - l >= rivalTime) { setRivalIn(true); if (sound) SFX.rival(); }
      if (l <= 0 && !doneRef.current) { doneRef.current = true; onAnswer(null, 0); }
    }, 100);
    return () => clearInterval(id);
  });
  const pick = (o) => { if (doneRef.current) return; doneRef.current = true; if (sound) SFX.buzz(); onAnswer(o, Math.max(0, TIME - (performance.now() - start.current) / 1000)); };
  useEffect(() => {
    const k = (e) => { if (document.querySelector('[role="dialog"]') || e.metaKey || e.ctrlKey || e.altKey) return; const n = +e.key; if (n >= 1 && n <= 4) pick(round.options[n - 1]); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });
  return (
    <div className="rise">
      <div className="mt-4 flex items-center gap-3"><div className="clock flex-1" aria-hidden="true"><span style={{ width: `${(left / TIME) * 100}%` }} /></div><span className="display w-10 text-right text-[20px] tabular-nums text-[color:var(--gold)]" aria-label={`${Math.ceil(left)} seconds left`}>{Math.ceil(left)}</span></div>
      <div className="qpanel mt-4">
        <div className="flex flex-wrap items-center justify-between gap-2 text-[12px] font-black uppercase tracking-[.14em] text-[color:var(--muted)]"><span>{round.q.cat}</span><span>Question {num} of {SIZE}</span></div>
        <h2 className="mt-2 text-[22px] sm:text-[27px] font-black leading-snug">{round.q.q}</h2>
        {rivalTime != null && <div className="mt-2 h-5 text-[13px] font-black text-[color:var(--rival)]">{rivalIn ? "🔔 Your rival locked in an answer!" : ""}</div>}
      </div>
      <div className="mt-4 grid gap-2.5 sm:grid-cols-2">
        {round.options.map((o, k) => <button key={o} className="buzz" onClick={() => pick(o)}><span className="k" aria-hidden="true">{k + 1}</span><span className="min-w-0">{o}</span></button>)}
      </div>
    </div>
  );
}

/* The reveal after a question: who picked what. */
function Reveal({ round, picks, names, onNext, last }) {
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus({ preventScroll: true }); }, []);
  return (
    <div className="pop">
      <div className="qpanel mt-4">
        <div className="text-[12px] font-black uppercase tracking-[.14em] text-[color:var(--muted)]">{round.q.cat}</div>
        <h2 className="mt-2 text-[20px] sm:text-[24px] font-black leading-snug">{round.q.q}</h2>
        {round.q.fact && <p className="mt-2 text-[14px] text-[color:var(--muted)]">💡 {round.q.fact}</p>}
      </div>
      <div className="mt-4 grid gap-2.5 sm:grid-cols-2">
        {round.options.map((o, k) => {
          const isAns = o === round.q.answer, who = picks.map((p, i) => p.pick === o ? i : -1).filter(i => i >= 0);
          return (
            <div key={o} className={`buzz ${isAns ? "right" : who.length ? "wrong" : "dim"}`}>
              <span className="k" aria-hidden="true">{isAns ? "✓" : k + 1}</span><span className="min-w-0 flex-1">{o}</span>
              {who.map(i => <span key={i} className={`tagp ${i === 0 ? "you" : "rival"}`}>{names[i]}</span>)}
            </div>
          );
        })}
      </div>
      <div className="mt-3 grid grid-cols-2 gap-2 text-center text-[14px] font-black">
        {picks.map((p, i) => <div key={i} className="rounded-xl border-2 border-black bg-black/25 px-3 py-2" style={{ color: i === 0 ? "var(--you)" : "var(--rival)" }}>{names[i]}: {p.pick == null ? "⏰ time's up" : p.pts ? `+${p.pts}` : "+0"}</div>)}
      </div>
      <div className="mt-4 flex justify-end"><button ref={ref} onClick={onNext} className="btn btn-gold min-w-[11rem] px-6 py-3 text-[17px]">{last ? "Final scores →" : "Next question →"}</button></div>
    </div>
  );
}

function Results({ names, avs, scores, onAgain, againLabel, onHome, share, flightNote }) {
  const [copied, setCopied] = useState(false), [fallback, setFallback] = useState(false), taRef = useRef(null);
  const copy = () => { const ok = () => { setCopied(true); setTimeout(() => setCopied(false), 2200); }; const no = () => { setFallback(true); setTimeout(() => taRef.current && taRef.current.select(), 30); }; try { navigator.clipboard.writeText(share).then(ok).catch(no); } catch { no(); } };
  const tie = scores[0] === scores[1], w = scores[0] > scores[1] ? 0 : 1;
  return (
    <main className="mt-5 grid gap-4 lg:grid-cols-[minmax(0,1fr)_300px]">
      <section className="pop min-w-0 rounded-[22px] border-2 border-b-[6px] border-black bg-[color:var(--panel)] p-5 sm:p-7 text-center">
        <div className="text-[56px] leading-none" aria-hidden="true">{tie ? "🤝" : avs[w]}</div>
        <h2 className="display mt-2 text-[34px] sm:text-[44px] leading-none text-[color:var(--gold)]">{tie ? "It's a tie!" : `${names[w]} wins!`}</h2>
        <div className="mt-4 grid grid-cols-2 gap-3">
          {[0, 1].map(i => <div key={i} className="rounded-2xl border-2 border-black p-3" style={{ background: i === 0 ? "#0E4A5A" : "#5A0E3B" }}><div className="text-[13px] text-[color:var(--muted)]">{avs[i]} {names[i]}</div><div className="display text-[38px] tabular-nums">{scores[i]}</div></div>)}
        </div>
        <div className="mt-5 flex flex-wrap gap-2">
          <button onClick={onAgain} className="btn btn-gold min-w-[11rem] flex-1 py-3 text-[17px]">{againLabel}</button>
          <button onClick={onHome} className="btn btn-plain min-w-[11rem] flex-1 py-3 text-[16px]">← Battle menu</button>
        </div>
        <div className="mt-6 rounded-2xl border-2 border-b-[6px] border-[color:var(--gold-d)] bg-[color:var(--stage-2)] p-4 text-left">
          <div className="text-[10px] font-extrabold uppercase tracking-[.18em] text-[color:var(--muted)]">Sponsored</div>
          <div className="display mt-1 text-[19px] leading-tight">{flightNote}</div>
          <a href={GR.flightLink()} target="_blank" rel="noopener sponsored" className="btn btn-gold mt-3 block w-full py-3 text-center text-[16px]">Find cheap flights ↗</a>
        </div>
      </section>
      <aside className="min-w-0 space-y-4">
        <div className="rounded-[20px] border-2 border-b-[6px] border-black bg-[color:var(--panel)] p-5">
          <div className="text-[11px] font-extrabold uppercase tracking-[.14em] text-[color:var(--muted)]">Share card</div>
          <pre className="mt-2 whitespace-pre-wrap rounded-xl bg-black/30 p-3 text-[13px] font-bold leading-relaxed" style={{ fontFamily: "ui-monospace,Menlo,Consolas,monospace" }}>{share}</pre>
          {fallback && <div className="mt-2"><div className="mb-1 text-[12px] font-bold text-[color:var(--gold)]">Copying is blocked here. The text is selected, so press Ctrl+C or ⌘+C.</div><textarea ref={taRef} readOnly value={share} rows={5} className="w-full rounded-lg bg-black/30 p-2 text-[12px]" /></div>}
          <button onClick={copy} className="btn btn-rival mt-3 w-full py-3 text-[17px]">{copied ? "✓ Copied!" : "Copy & Challenge a Friend"}</button>
          <div className="mt-4"><AdSlot w={300} h={250} size="300×250 Medium Rectangle" /></div>
        </div>
        <div className="rounded-[20px] border-2 border-black bg-[color:var(--panel)] p-4 text-center text-[13px] text-[color:var(--muted)]">New rival in <Countdown /></div>
      </aside>
    </main>
  );
}

/* ---------- Solo battle vs today's rival ---------- */
function Solo({ mode, sound, onHome, onBonus }) {
  const { rival, rounds } = useMemo(() => buildBattle(mode), [mode]);
  const SAVE_KEY = `ttb-${DAY.id}`, LINEUP = rounds.map(r => r.q.id).join(",");
  const [log, setLog] = useState(() => { if (!mode.daily) return []; const s = store.get(SAVE_KEY, null); return s && s.lineup === LINEUP && Array.isArray(s.log) ? s.log : []; });
  const [revealed, setRevealed] = useState(false);
  useEffect(() => { if (mode.daily) store.set(SAVE_KEY, { log, lineup: LINEUP }); }, [log]);
  const idx = revealed ? log.length - 1 : log.length, done = log.length >= SIZE && !revealed;
  const you = log.reduce((s, l) => s + l.pts, 0), them = log.reduce((s, l, i) => s + (rounds[i].rival.pick === rounds[i].q.answer ? pointsFor(true, TIME - rounds[i].rival.t) : 0), 0);
  const answer = (pick, left) => { const r = rounds[idx], ok = pick === r.q.answer; if (sound) (ok ? SFX.right : SFX.wrong)(); setLog(l => [...l, { pick, pts: pointsFor(ok, left) }]); setRevealed(true); };
  const next = () => { setRevealed(false); if (log.length >= SIZE) { if (sound) (you >= them ? SFX.win : SFX.lose)(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
  useEffect(() => { if (done && mode.daily) { const st = store.get("ttb-record", { w: 0, l: 0, last: 0 }); if (st.last !== DAY.id) store.set("ttb-record", { w: st.w + (you > them ? 1 : 0), l: st.l + (you < them ? 1 : 0), last: DAY.id }); } }, [done]);

  if (done) {
    const share = `⚔️ Travel Trivia Battle ${mode.daily ? `#${DAY.id}` : "· Bonus battle"}\n${you > them ? "I beat" : you < them ? "I lost to" : "I tied"} ${rival.name} ${rival.av}, ${you}–${them}\n${log.map(l => l.pts >= 80 ? "⚡" : l.pts ? "🟩" : "🟥").join("")}\nCan you beat them? ${GR.gameUrl("trivia-battle")}`;
    return <Results names={["You", rival.name]} avs={["🧳", rival.av]} scores={[you, them]} onAgain={onBonus} againLabel="🎲 Bonus battle" onHome={onHome} share={share} flightNote="Won the trivia? Go see the world for real." />;
  }
  const r = rounds[Math.min(idx, SIZE - 1)];
  const shownThem = log.slice(0, revealed ? log.length : log.length).reduce((s, l, i) => s + (rounds[i].rival.pick === rounds[i].q.answer ? pointsFor(true, TIME - rounds[i].rival.t) : 0), 0);
  return (
    <main className="mt-5">
      <Board left={{ av: "🧳", name: "You", score: you }} right={{ av: rival.av, name: rival.name, score: shownThem }} />
      {!revealed
        ? <Question key={idx} round={r} num={idx + 1} sound={sound} rivalTime={r.rival.t} onAnswer={answer} />
        : <Reveal round={r} picks={[log[idx], { pick: r.rival.pick, pts: r.rival.pick === r.q.answer ? pointsFor(true, TIME - r.rival.t) : 0 }]} names={["You", rival.name.split(" ").slice(-1)[0]]} onNext={next} last={log.length >= SIZE} />}
    </main>
  );
}

/* ---------- 2 players, pass the phone ---------- */
function Duo({ sound, onHome }) {
  const [names, setNames] = useState(() => store.get("ttb-names", ["Player 1", "Player 2"]));
  const [seed, setSeed] = useState(() => Math.floor(Math.random() * 1e9));
  const { rounds } = useMemo(() => buildBattle({ daily: false, seed }), [seed]);
  const [stage, setStage] = useState("setup");         // setup | handoff | ask | reveal | done
  const [turn, setTurn] = useState(0), [idx, setIdx] = useState(0);
  const [log, setLog] = useState([]);                  // per question: [p0, p1]
  useEffect(() => { store.set("ttb-names", names); }, [names]);
  const scores = [0, 1].map(p => log.reduce((s, l) => s + (l[p] ? l[p].pts : 0), 0));
  const r = rounds[idx];
  const answer = (pick, left) => {
    const ok = pick === r.q.answer, entry = { pick, pts: pointsFor(ok, left) };
    setLog(l => { const c = l.slice(); c[idx] = [...(c[idx] || [])]; c[idx][turn] = entry; return c; });
    if (turn === 0) { setTurn(1); setStage("handoff"); } else { if (sound) SFX.right(); setStage("reveal"); }
  };
  const next = () => { if (idx + 1 >= SIZE) { setStage("done"); if (sound) SFX.win(); window.scrollTo({ top: 0, behavior: "smooth" }); } else { setIdx(idx + 1); setTurn(0); setStage("handoff"); } };
  const again = () => { setSeed(Math.floor(Math.random() * 1e9)); setLog([]); setIdx(0); setTurn(0); setStage("handoff"); };

  if (stage === "setup") return (
    <main className="mx-auto mt-6 max-w-lg pop rounded-[22px] border-2 border-b-[6px] border-black bg-[color:var(--panel)] p-6">
      <h2 className="display text-[26px] text-[color:var(--gold)]">2-player battle</h2>
      <p className="mt-1 text-[color:var(--muted)]">One phone, two travelers. Take turns answering the same {SIZE} questions.</p>
      <form className="mt-4 space-y-3" onSubmit={e => { e.preventDefault(); setStage("handoff"); }}>
        {[0, 1].map(i => <label key={i} className="block text-[13px] font-black" style={{ color: i === 0 ? "var(--you)" : "var(--rival)" }}>{i === 0 ? "🧳 Player 1" : "🎒 Player 2"}
          <input id={`p${i}`} value={names[i]} maxLength={14} onChange={e => { const n = names.slice(); n[i] = e.target.value; setNames(n); }} className="mt-1 block w-full rounded-xl border-2 border-black bg-black/30 px-3 py-2.5 text-[16px] text-white" /></label>)}
        <button type="submit" className="btn btn-gold w-full py-3 text-[17px]">Start the battle</button>
      </form>
      <button onClick={onHome} className="mt-3 w-full text-center text-[14px] font-black text-[color:var(--muted)] underline underline-offset-2">← Back</button>
    </main>
  );
  const nm = names.map((n, i) => n.trim() || `Player ${i + 1}`);
  if (stage === "done") return <Results names={nm} avs={["🧳", "🎒"]} scores={scores} onAgain={again} againLabel="🔁 Rematch" onHome={onHome}
    share={`⚔️ Travel Trivia Battle · 2 players\n${nm[0]} ${scores[0]} – ${scores[1]} ${nm[1]}\n${scores[0] === scores[1] ? "Dead heat!" : `${nm[scores[0] > scores[1] ? 0 : 1]} takes the crown 👑`}\nPlay: ${GR.gameUrl("trivia-battle")}`} flightNote="Plan the trip you two keep talking about." />;
  return (
    <main className="mt-5">
      <Board left={{ av: "🧳", name: nm[0], score: stage === "reveal" ? scores[0] : scores[0] - (log[idx] && log[idx][0] ? log[idx][0].pts : 0) }} right={{ av: "🎒", name: nm[1], score: stage === "reveal" ? scores[1] : scores[1] - (log[idx] && log[idx][1] ? log[idx][1].pts : 0) }} />
      {stage === "handoff" && (
        <div className="pop mx-auto mt-6 max-w-lg rounded-[22px] border-2 border-b-[6px] border-black bg-[color:var(--panel)] p-6 text-center">
          <div className="text-[44px]" aria-hidden="true">{turn === 0 ? "🧳" : "🎒"}</div>
          <h2 className="display mt-1 text-[26px]" style={{ color: turn === 0 ? "var(--you)" : "var(--rival)" }}>{nm[turn]}, you're up!</h2>
          <p className="mt-1 text-[color:var(--muted)]">Question {idx + 1} of {SIZE}. {turn === 1 ? `No peeking, ${nm[0]}!` : "Hand the phone over if you need to."}</p>
          <button onClick={() => setStage("ask")} className={`btn ${turn === 0 ? "btn-you" : "btn-rival"} mt-4 w-full py-3 text-[17px]`} autoFocus>I'm ready</button>
        </div>
      )}
      {stage === "ask" && <Question key={`${idx}-${turn}`} round={r} num={idx + 1} sound={sound} rivalTime={null} onAnswer={answer} />}
      {stage === "reveal" && <Reveal round={r} picks={log[idx]} names={nm} onNext={next} last={idx + 1 >= SIZE} />}
    </main>
  );
}

function App() {
  const [view, setView] = useState("menu");             // menu | solo | duo
  const [mode, setMode] = useState({ daily: true, seed: 0 });
  const [sound, setSound] = useState(() => store.get("ttb-sound", true));
  const [showHelp, setShowHelp] = useState(false);
  useEffect(() => { store.set("ttb-sound", sound); }, [sound]);
  const todays = buildBattle({ daily: true }).rival, rec = store.get("ttb-record", { w: 0, l: 0, last: 0 });
  const home = () => { setView("menu"); setMode({ daily: true, seed: 0 }); window.scrollTo({ top: 0 }); };
  return (
    <div className="mx-auto max-w-3xl">
      <header className="mt-1 flex items-center justify-between gap-3">
        <div className="min-w-0">
          <h1 className="display text-[28px] sm:text-[40px] leading-none"><span className="text-[color:var(--you)]">Trivia</span> <span className="text-[color:var(--rival)]">Battle</span> <span aria-hidden="true">⚔️</span></h1>
          <div className="mt-1 truncate text-[12px] font-extrabold uppercase tracking-[.16em] text-[color:var(--muted)]">Travel edition · #{DAY.id} · {DAY.label}</div>
        </div>
        <div className="flex items-center gap-1.5 sm:gap-2">
          <button onClick={() => setSound(x => !x)} className="chip grid h-10 w-10 place-items-center text-[16px]" aria-label={sound ? "Mute sounds" : "Turn sounds on"} aria-pressed={sound}>{sound ? "🔊" : "🔇"}</button>
          <button onClick={() => setShowHelp(true)} className="chip grid h-10 w-10 place-items-center text-[17px] font-extrabold" aria-label="How to play">?</button>
        </div>
      </header>
      <div className="mt-4 hidden md:block"><AdSlot w={728} h={90} size="728×90 Leaderboard" /></div>

      {view === "menu" && (
        <main className="mt-5 grid gap-4 sm:grid-cols-2">
          <button onClick={() => { setMode({ daily: true, seed: 0 }); setView("solo"); }} className="pop rounded-[22px] border-2 border-b-[8px] border-black p-5 text-left transition-transform hover:-translate-y-1" style={{ background: "linear-gradient(160deg,#4A1240,#2E1F5E)" }}>
            <div className="text-[12px] font-black uppercase tracking-[.16em] text-[color:var(--rival)]">Daily battle · today's rival</div>
            <div className="mt-3 flex items-center gap-3"><span className="text-[54px] leading-none" aria-hidden="true">{todays.av}</span><div><div className="display text-[24px] leading-tight">{todays.name}</div><div className="text-[14px] text-[color:var(--muted)]">{todays.tag}</div></div></div>
            <div className="mt-4 text-[14px] text-[color:var(--muted)]">{SIZE} questions · {TIME} seconds each · your record: <b className="text-white">{rec.w}W–{rec.l}L</b></div>
            <div className="btn btn-rival mt-4 py-3 text-center text-[17px]">⚔️ Start the battle</div>
          </button>
          <button onClick={() => setView("duo")} className="pop rounded-[22px] border-2 border-b-[8px] border-black p-5 text-left transition-transform hover:-translate-y-1" style={{ background: "linear-gradient(160deg,#0E4A5A,#2E1F5E)" }}>
            <div className="text-[12px] font-black uppercase tracking-[.16em] text-[color:var(--you)]">Pass the phone</div>
            <div className="mt-3 flex items-center gap-3"><span className="text-[54px] leading-none" aria-hidden="true">👥</span><div><div className="display text-[24px] leading-tight">2-player battle</div><div className="text-[14px] text-[color:var(--muted)]">Settle who's the real travel expert</div></div></div>
            <div className="mt-4 text-[14px] text-[color:var(--muted)]">Same questions for both · new set every match</div>
            <div className="btn btn-you mt-4 py-3 text-center text-[17px]">👥 Play with a friend</div>
          </button>
        </main>
      )}
      {view === "solo" && <Solo key={JSON.stringify(mode)} mode={mode} sound={sound} onHome={home} onBonus={() => { setMode({ daily: false, seed: Math.floor(Math.random() * 1e9) }); window.scrollTo({ top: 0 }); }} />}
      {view === "duo" && <Duo sound={sound} onHome={home} />}

      <footer className="mt-8 text-center text-[12px] font-bold text-[color:var(--muted)]">Travel Trivia Battle · a GlobeRush game</footer>
      <div className="sticky-ad md:hidden"><AdSlot w={320} h={50} size="320×50 Sticky Banner" /></div>
      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
