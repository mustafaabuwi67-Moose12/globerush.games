const AFFILIATE = {
  route:   "https://www.skyscanner.com/transport/flights/{from}/{to}/",   // both airports known
  toOnly:  "https://www.skyscanner.com/transport/flights-to/{to}/",        // destination only (player hasn't picked an airport)

function fareLink(from, to) {
  const t = from && to ? AFFILIATE.route : to ? AFFILIATE.toOnly : AFFILIATE.general;
  const f = (from || "").trim(), d = (to || "").trim();
  return t.replace(/\{FROM\}/g, f.toUpperCase()).replace(/\{TO\}/g, d.toUpperCase())

  {"id": "a407", "a": "O", "text": "Its main area code is 407", "more": "Las Vegas uses 702 and 725."},
];
const ROUND = 10, HALF = ROUND / 2;
// Daily #1 is Oct 19, 2026; the number goes up by one each local calendar day.
const LAUNCH = Date.UTC(2026, 9, 19);
const DAY = (() => {
  const n = new Date(), today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  return { id: Math.max(1, Math.round((today - LAUNCH) / 864e5) + 1), label: n.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) };
})();
// deterministic shuffle so everyone gets the same daily set
function seeded(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function shuffle(arr, r) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Each city's facts are shuffled once; daily sets walk through them in order, so nothing repeats until the whole pool is used.
const POOL_V = shuffle(FACTS.filter(f => f.a === "V"), seeded(4242));
const POOL_O = shuffle(FACTS.filter(f => f.a === "O"), seeded(9191));
const take = (pool, start) => Array.from({ length: HALF }, (_, i) => pool[(start + i) % pool.length]);
// 5 Vegas + 5 Orlando, never more than 2 of the same city in a row, so guessing patterns doesn't work
function arrange(v, o, r) {
  for (let tries = 0; tries < 200; tries++) {
    const s = shuffle([...v, ...o], r);
    if (!s.some((f, i) => i >= 2 && f.a === s[i - 1].a && f.a === s[i - 2].a)) return s;
  }
  return v.flatMap((f, i) => [f, o[i]]);
}
function pickSet(mode) {
  if (mode.daily) return arrange(take(POOL_V, (DAY.id - 1) * HALF), take(POOL_O, (DAY.id - 1) * HALF), seeded(DAY.id * 7919));
  const r = seeded(mode.seed);
  return arrange(shuffle(POOL_V, r).slice(0, HALF), shuffle(POOL_O, r).slice(0, HALF), r);
}

/* ---------- Sound ---------- */
let AC = null;
function tone(freqs, type = "square", step = .08, len = .18, vol = .06) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + .01 + i * step;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + .05);
    });
  } catch {}
}
const SFX = {
  right: () => tone([784, 988, 1319]),                              // slot-machine "ding ding"
  wrong: () => tone([196, 147], "sawtooth", .12, .2, .05),
  jackpot: () => tone([523, 659, 784, 1047, 784, 1047, 1319], "square", .09, .22, .06),
};

}

function Countdown() {
  const calc = () => { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const s = Math.max(0, Math.floor((m - n) / 1000)); return `${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
  const [t, setT] = useState(calc());
  useEffect(() => { const i = setInterval(() => setT(calc()), 1000); return () => clearInterval(i); }, []);
  return <span className="mono">{t}</span>;
}

const SAVE_KEY = `vegas-orlando-${DAY.id}`;

function App() {
  const saved = store.get(SAVE_KEY, null);
  const [mode, setMode] = useState({ daily: true, seed: 0 });
  const set = useMemo(() => pickSet(mode), [mode]);
  const [answers, setAnswers] = useState(saved?.answers || []);
  const [idx, setIdx] = useState(Math.min(saved?.answers?.length || 0, ROUND));
  const [shown, setShown] = useState(false);                 // current answer revealed
  const [home, setHome] = useState(() => store.get("vegas-orlando-home", ""));
  const [sound, setSound] = useState(() => store.get("vegas-orlando-sound", true));
  const [streak, setStreak] = useState(() => store.get("vegas-orlando-streak", { count: 0, last: 0 }));
  const [showHelp, setShowHelp] = useState(false);
  const [copied, setCopied] = useState(false), [fallback, setFallback] = useState(false);
  const taRef = useRef(null);

  const done = idx >= ROUND;
  const f = set[Math.min(idx, ROUND - 1)];
  const mine = answers[idx];
  const right = answers.filter((a, i) => a === set[i].a).length;
  let run = 0; for (let i = answers.length - 1; i >= 0 && answers[i] === set[i].a; i--) run++;
  const byCity = { V: [0, 0], O: [0, 0] };
  set.forEach((q, i) => { if (answers[i] != null) { byCity[q.a][1]++; if (answers[i] === q.a) byCity[q.a][0]++; } });

  useEffect(() => { if (mode.daily) store.set(SAVE_KEY, { answers }); }, [answers, mode.daily]);
  useEffect(() => { store.set("vegas-orlando-home", home); }, [home]);
  useEffect(() => { store.set("vegas-orlando-sound", sound); }, [sound]);

  const answer = (city) => {
    if (done || shown) return;
    const next = [...answers]; next[idx] = city; setAnswers(next); setShown(true);
    if (sound) (city === f.a ? SFX.right : SFX.wrong)();
  };
  const advance = () => {
    const n = idx + 1; setShown(false); setIdx(n);
    if (n >= ROUND) {
      if (sound) SFX.jackpot();
      if (mode.daily && streak.last !== DAY.id) { const s = { count: streak.last === DAY.id - 1 ? streak.count + 1 : 1, last: DAY.id }; setStreak(s); store.set("vegas-orlando-streak", s); }
    }
  };
  const restart = (newMode) => { setMode(newMode); setAnswers([]); setIdx(0); setShown(false); setCopied(false); setFallback(false); window.scrollTo({ top: 0, behavior: "smooth" }); };

  useEffect(() => {
    const k = (e) => {
      if (document.querySelector('[role="dialog"]') || e.metaKey || e.ctrlKey || e.target.tagName === "SELECT") return;
      if (!done && !shown && (e.key === "ArrowLeft" || e.key.toLowerCase() === "v")) answer("V");
      else if (!done && !shown && (e.key === "ArrowRight" || e.key.toLowerCase() === "o")) answer("O");
      else if (shown && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); advance(); }
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });

  const text = shareText(set, answers, home, mode.daily);
  const playBonus = () => restart({ daily: false, seed: Math.floor(Math.random() * 1e9) });
  const backToDaily = () => { const s = store.get(SAVE_KEY, null); setMode({ daily: true, seed: 0 }); setAnswers(s?.answers || []); setIdx(Math.min(s?.answers?.length || 0, ROUND)); setShown(false); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const copy = () => {
    const ok = () => { setCopied(true); setTimeout(() => setCopied(false), 2200); };
    const no = () => { setFallback(true); setTimeout(() => taRef.current && taRef.current.select(), 30); };
    try { navigator.clipboard.writeText(text).then(ok).catch(no); } catch { no(); }
  };
  const verdict = right === ROUND ? "JACKPOT! 🎰" : right >= 8 ? "High roller" : right >= 6 ? "Seasoned tourist" : right >= 4 ? "Day-tripper" : "First-time visitor";
  const vPct = byCity.V[1] ? Math.round(byCity.V[0] / byCity.V[1] * 100) : 0, oPct = byCity.O[1] ? Math.round(byCity.O[0] / byCity.O[1] * 100) : 0;
  const better = vPct === oPct ? "You know both cities equally well." : vPct > oPct ? "You know Vegas better. Maybe it's calling you? 🎰" : "You know Orlando better. Maybe it's calling you? 🎢";
  const correct = shown && mine === f.a;

  return (
    <div className="mx-auto max-w-5xl">
      <header className="flex items-center justify-between gap-3 py-1.5">

        {run >= 2 && !done && <span className="pop rounded-full bg-[color:var(--gold)] px-2.5 py-0.5 text-[12px] font-extrabold text-[#2A1C00]">🔥 {run} in a row</span>}

            <div className="half orlando"><div className="sunball" /><Skyline side="O" />
              <button className={`pick o ${shown && f.a !== "O" ? "dim" : ""}`} disabled={shown} onClick={() => answer("O")} aria-label="Orlando">
                🎢 Orlando<small>→ or O</small>

              <div className="flex items-center justify-between gap-2 text-[11px] font-extrabold uppercase tracking-[.16em] text-[color:var(--card-muted)]">
                <span>Fact {idx + 1} of {ROUND}</span>
                {shown && <span className="pop rounded-full px-2.5 py-0.5 text-white" style={{ background: correct ? "var(--right)" : "var(--wrong)" }}>{correct ? "Correct!" : "Nope!"}</span>}
              </div>
              <h2 className="mt-2 text-[22px] sm:text-[28px] font-extrabold leading-[1.15]">{f.text}</h2>
              {shown ? (
                <div className="pop mt-3">
                  <p className="text-[15px] font-semibold text-[color:var(--card-muted)]">
                    <b style={{ color: f.a === "V" ? "var(--neon-d)" : "var(--sun-d)" }}>{f.a === "V" ? "Las Vegas." : "Orlando."}</b> {f.more}
                  </p>
                  <button onClick={advance} className="btn btn-gold mt-3 w-full py-3 text-[16px]">{idx + 1 < ROUND ? "Next fact →" : "See my score →"}</button>
                </div>
              ) : (
                <p className="mt-2 text-[14px] font-bold text-[color:var(--card-muted)]">Vegas or Orlando? Tap a side.</p>

          <section className="pop min-w-0 rounded-[24px] border-2 border-b-[6px] border-black bg-[color:var(--card)] p-5 text-[color:var(--card-ink)] sm:p-6">
            <div className="text-[12px] font-extrabold uppercase tracking-[.16em] text-[color:var(--card-muted)]">{mode.daily ? `Daily #${DAY.id}` : "Bonus round"} · final score</div>

            {mode.daily && <p className="mt-2 text-[13px] font-semibold text-[color:var(--card-muted)]">Bonus rounds are just for fun and don't change your daily score.</p>}

            <h3 className="mt-6 text-[18px] font-extrabold">Ready for the real thing?</h3>
            <p className="text-[14px] font-semibold text-[color:var(--card-muted)]">{home ? `Flights from ${HOMES[home]} (${home}).` : "Pick your airport for flights from where you live."}</p>
            <div className="mt-2 flex flex-wrap items-center gap-2">
              <label htmlFor="home-airport" className="text-[14px] font-extrabold">🛫 Flying from</label>
              <select id="home-airport" value={home} onChange={e => setHome(e.target.value)}
                className="min-w-0 max-w-full rounded-xl border-2 border-[#D8CCEA] bg-white px-3 py-2 text-[15px] font-bold text-[color:var(--card-ink)]">
                <option value="">Pick your airport…</option>
                {Object.keys(HOMES).sort((a, b) => HOMES[a].localeCompare(HOMES[b])).map(c => <option key={c} value={c}>{HOMES[c]} ({c})</option>)}
              </select>
            </div>
            <div className="mt-3"><FlightCards home={home} /></div>
          </section>

          <aside className="min-w-0 space-y-4">
            <div className="rounded-[24px] border-2 border-b-[6px] border-black bg-[color:var(--page-2)] p-5">
              <div className="text-[11px] font-extrabold uppercase tracking-[.14em] text-[color:var(--muted)]">Share card</div>
              <pre className="mt-2 whitespace-pre-wrap rounded-xl bg-black/30 p-3 mono text-[13px] leading-relaxed">{text}</pre>
              {fallback && (
                <div className="mt-2">
                  <div className="mb-1 text-[12px] font-bold text-[color:var(--gold)]">Copying is blocked here. The text is selected, so press Ctrl+C or ⌘+C.</div>
                  <textarea ref={taRef} id="share-fallback" readOnly value={text} rows={3} className="w-full rounded-lg bg-black/30 p-2 mono text-[12px]" />
                </div>
              )}
              <button onClick={copy} className="btn btn-gold mt-3 w-full py-3 text-[17px]">{copied ? "✓ Copied!" : "Copy Result"}</button>
              <div className="mt-4"><AdSlot w={300} h={250} size="300×250 Medium Rectangle" /></div>
            </div>
            <div className="rounded-[24px] border-2 border-black bg-[color:var(--page-2)] p-4 text-center text-[13px] text-[color:var(--muted)]">
              New facts in <Countdown />
              <div className="mt-3 grid gap-2">
                <button onClick={playBonus} className="btn btn-plain py-2.5 text-[15px]">🎲 Bonus round</button>
                {!mode.daily && <button onClick={backToDaily} className="btn btn-plain py-2.5 text-[15px]">← Back to today's set</button>}
                {mode.daily && <button onClick={() => restart({ daily: true, seed: 0 })} className="btn btn-plain py-2.5 text-[15px]">↺ Replay today's set</button>}
              </div>
            </div>
          </aside>
        </main>
      )}

      <footer className="mt-8 text-center text-[12px] font-semibold text-[color:var(--muted)]">Vegas or Orlando? prototype · spot a fact that's out of date? Let us know</footer>
      <div className="sticky-ad md:hidden"><AdSlot w={320} h={50} size="320×50 Sticky Banner" /></div>
      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
