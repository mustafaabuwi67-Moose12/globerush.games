<style>

const ALL = CITIES.map(([id, city, country, code, region, flag, clues]) => ({ id, city, country, code, region, flag, clues }));
const SIZE = 5, OPTS = 6, MAXPTS = 5;
const DAY = GR.day();
const POOL = GR.shuffled(ALL, 5150);
function buildRounds(mode) {
  const picks = mode.daily ? Array.from({ length: SIZE }, (_, i) => POOL[((DAY.id - 1) * SIZE + i) % POOL.length]) : GR.shuffled(POOL, mode.seed).slice(0, SIZE);
  return picks.map((c, i) => {
    const seed = (mode.daily ? DAY.id * 7919 : mode.seed) + i * 104729;
    const same = GR.shuffled(ALL.filter(x => x.id !== c.id && x.region === c.region), seed);
    const other = GR.shuffled(ALL.filter(x => x.id !== c.id && x.region !== c.region), seed + 1);
    return { c, options: GR.shuffled([c, ...[...same.slice(0, 3), ...other].slice(0, OPTS - 1)], seed + 2) };
  });
}
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// a round result: { wrong: [ids], solved: bool, clues: number shown }
const ptsOf = r => r && r.solved ? Math.max(1, MAXPTS - (r.clues - 1)) : 0;
const sq = r => !r.solved ? "⬛" : ["🟩", "🟩", "🟨", "🟧", "🟥"][Math.min(4, r.clues - 1)];

const rankFor = s => RANKS.find(([m]) => s >= m);

let AC = null;
function tone(f, type = "triangle", step = .07, len = .2, vol = .1) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); f.forEach((fr, i) => { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + .01 + i * step; o.type = type; o.frequency.value = fr; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + len); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + .05); }); } catch {} }
const SFX = { right: () => tone([660, 880, 1175]), wrong: () => tone([220, 165], "sawtooth", .12, .25, .05), done: () => tone([523, 659, 784, 1047], "triangle", .1, .3, .1) };

}
function Countdown() {
  const calc = () => { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const s = Math.max(0, Math.floor((m - n) / 1000)); return `${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };

function App() {
  const [mode, setMode] = useState({ daily: true, seed: 0 });
  const SAVE_KEY = `gtc-${DAY.id}`;

  const load = () => { const s = store.get(SAVE_KEY, null); return s && s.lineup === LINEUP && Array.isArray(s.results) ? s : { results: [], cur: null }; };

  const init = useMemo(load, []);

  const [cur, setCur] = useState(init.cur || { wrong: [], clues: 1, solved: false, over: false });
  const [sound, setSound] = useState(() => store.get("gtc-sound", true));
  const [streak, setStreak] = useState(() => store.get("gtc-streak", { count: 0, last: 0 }));
  const [showHelp, setShowHelp] = useState(false), [shake, setShake] = useState(false);
  const [copied, setCopied] = useState(false), [fallback, setFallback] = useState(false);
  const taRef = useRef(null), nextRef = useRef(null);

  const idx = results.length, done = idx >= SIZE;
  const round = rounds[Math.min(idx, SIZE - 1)];
  const finished = cur.solved || cur.over;
  const total = results.reduce((s, r) => s + ptsOf(r), 0);

  useEffect(() => { if (mode.daily) store.set(SAVE_KEY, { results, cur, lineup: LINEUP }); }, [results, cur, mode.daily]);
  useEffect(() => { store.set("gtc-sound", sound); }, [sound]);
  useEffect(() => { if (finished && nextRef.current) nextRef.current.focus({ preventScroll: true }); }, [finished]);

  const guess = (o) => {
    if (finished || done || cur.wrong.includes(o.id)) return;
    if (o.id === round.c.id) { if (sound) SFX.right(); setCur({ ...cur, solved: true }); return; }
    if (sound) SFX.wrong(); setShake(true); setTimeout(() => setShake(false), 320);
    const wrong = [...cur.wrong, o.id], clues = cur.clues + 1;
    setCur(clues > MAXPTS ? { ...cur, wrong, over: true } : { ...cur, wrong, clues });
  };
  const moreClue = () => { if (finished) return; const clues = cur.clues + 1; setCur(clues > MAXPTS ? { ...cur, over: true } : { ...cur, clues }); };
  const next = () => {
    const res = [...results, { solved: cur.solved, clues: Math.min(cur.clues, MAXPTS), wrong: cur.wrong }];
    setResults(res); setCur({ wrong: [], clues: 1, solved: false, over: false });
    if (res.length >= SIZE) {
      if (sound) SFX.done();
      if (mode.daily && streak.last !== DAY.id) { const st = { count: streak.last === DAY.id - 1 ? streak.count + 1 : 1, last: DAY.id }; setStreak(st); store.set("gtc-streak", st); }
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const restart = (m) => { setMode(m); setResults([]); setCur({ wrong: [], clues: 1, solved: false, over: false }); setCopied(false); setFallback(false); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const backToDaily = () => { const s = load(); setMode({ daily: true, seed: 0 }); setResults(s.results); setCur(s.cur || { wrong: [], clues: 1, solved: false, over: false }); };

  useEffect(() => {
    const k = (e) => { if (document.querySelector('[role="dialog"]') || e.metaKey || e.ctrlKey || e.altKey || done || finished) return; const n = +e.key; if (n >= 1 && n <= OPTS) guess(round.options[n - 1]); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });

  const [, rName, rIcon] = rankFor(total);
  const shareTxt = done ? `📮 Guess the City ${mode.daily ? `#${DAY.id}` : "· Bonus trip"}\n${results.map(sq).join("")}\n${total}/${SIZE * MAXPTS} · ${rName} ${rIcon}\nPlay: ${GR.gameUrl("guess-the-city")}` : "";
  const copy = () => { const ok = () => { setCopied(true); setTimeout(() => setCopied(false), 2200); }; const no = () => { setFallback(true); setTimeout(() => taRef.current && taRef.current.select(), 30); }; try { navigator.clipboard.writeText(shareTxt).then(ok).catch(no); } catch { no(); } };
  const ptsNow = Math.max(1, MAXPTS - (cur.clues - 1));

  return (
    <div className="mx-auto max-w-3xl">
      <header className="mt-1 flex items-center justify-between gap-3">
        <div className="min-w-0">
          <h1 className="display text-[30px] sm:text-[42px] leading-none text-[color:var(--sun)]">Guess the City <span aria-hidden="true">📮</span></h1>
          <div className="mt-1 truncate text-[12px] font-extrabold uppercase tracking-[.16em] text-[color:var(--muted)]">{mode.daily ? `Postcards #${DAY.id} · ${DAY.label}` : "Bonus trip · just for fun"}</div>
        </div>
        <div className="flex items-center gap-1.5 sm:gap-2">
          <div className="chip flex items-center gap-1 px-3 py-1.5" title="Daily streak"><span aria-hidden="true">🔥</span><span className="text-[15px] font-extrabold tabular-nums">{streak.last >= DAY.id - 1 ? streak.count : 0}</span></div>
          <button onClick={() => setSound(x => !x)} className="chip grid h-10 w-10 place-items-center text-[16px]" aria-label={sound ? "Mute sounds" : "Turn sounds on"} aria-pressed={sound}>{sound ? "🔊" : "🔇"}</button>
          <button onClick={() => setShowHelp(true)} className="chip grid h-10 w-10 place-items-center text-[17px] font-extrabold" aria-label="How to play">?</button>
        </div>
      </header>
      <div className="mt-4 hidden md:block"><AdSlot w={728} h={90} size="728×90 Leaderboard" /></div>

      {!done ? (
        <main className="mt-5">
          <div className="flex items-center gap-3">
            <div className="flex flex-1 gap-1.5" aria-label={`City ${idx + 1} of ${SIZE}`}>{Array.from({ length: SIZE }, (_, i) => <span key={i} className="grid h-7 flex-1 place-items-center rounded-md border-2 border-black text-[13px]" style={{ background: i === idx ? "var(--sun)" : "rgba(255,255,255,.1)" }}>{results[i] ? sq(results[i]) : ""}</span>)}</div>
            <div className="chip px-3 py-1 text-[14px] font-extrabold tabular-nums">{total} pts</div>
          </div>
          <div key={idx} className="mt-5">
            <div className={`postcard ${shake ? "shake" : ""}`}>
              <div className="stampbox" aria-label={finished ? "" : `${ptsNow} points on offer`}>{finished ? <span className="text-[36px]" aria-hidden="true">{round.c.flag}</span> : <><b>{ptsNow}</b><small>POINTS</small></>}</div>
              <div className="text-[12px] font-extrabold uppercase tracking-[.16em] text-[#8A7F6B]">Postcard {idx + 1} of {SIZE} · Greetings from…</div>
              <div className="lines mt-2 pr-24">
                {round.c.clues.slice(0, finished ? MAXPTS : cur.clues).map((t, i) => <div key={i} className={`clue ${i === cur.clues - 1 && !finished ? "write" : ""}`}><span className="n">{i + 1}</span>{t}</div>)}
              </div>
              {finished && (
                <div className="pop mt-3 rounded-xl border-2 border-black bg-white/70 p-3">
                  <div className="text-[17px] font-black" style={{ color: cur.solved ? "var(--ok-d)" : "var(--stamp)" }}>{cur.solved ? `You got it! +${ptsNow}` : "Return to sender!"}</div>
                  <div className="display text-[26px] leading-tight">{round.c.flag} {round.c.city}, {round.c.country}</div>
                </div>
              )}
            </div>
            {!finished ? (
              <>
                <div className="mt-4 grid grid-cols-2 gap-2.5 sm:grid-cols-3">
                  {round.options.map((o, k) => <button key={o.id} className={`opt ${cur.wrong.includes(o.id) ? "out" : ""}`} disabled={cur.wrong.includes(o.id)} onClick={() => guess(o)}><span className="grid h-6 w-6 flex-none place-items-center rounded-md bg-black/30 text-[12px]" aria-hidden="true">{k + 1}</span><span className="min-w-0">{o.city}</span></button>)}
                </div>
                <div className="mt-4 flex justify-center"><button onClick={moreClue} className="btn btn-plain px-5 py-2.5 text-[15px]">{cur.clues < MAXPTS ? "📝 Read the next clue (−1 point)" : "🏳️ I give up"}</button></div>
              </>
            ) : (
              <div className="mt-4 grid gap-3 sm:grid-cols-[minmax(0,1fr)_auto]">
                <a href={GR.flightLink(null, round.c.code)} target="_blank" rel="noopener sponsored" className="btn btn-sun block py-3 text-center text-[16px]">✈️ Find flights to {round.c.city} ↗</a>
                <button ref={nextRef} onClick={next} className="btn btn-stamp px-6 py-3 text-[17px]">{idx + 1 >= SIZE ? "See my score →" : "Next postcard →"}</button>
              </div>
            )}
          </div>
        </main>
      ) : (
        <main className="mt-5 grid gap-4 lg:grid-cols-[minmax(0,1fr)_300px]">
          <section className="min-w-0">
            <div className="postcard pop">
              <div className="text-[12px] font-extrabold uppercase tracking-[.16em] text-[#8A7F6B]">{mode.daily ? `Postcards #${DAY.id}` : "Bonus trip"} · trip complete</div>
              <div className="mt-2 flex items-center gap-4"><span className="text-[56px] leading-none" aria-hidden="true">{rIcon}</span><div><div className="display text-[44px] leading-none tabular-nums">{total}/{SIZE * MAXPTS}</div><div className="display text-[20px]">{rName}</div></div></div>
              <ol className="mt-4 space-y-2">
                {rounds.map((r, i) => (
                  <li key={r.c.id} className="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-lg border-2 border-black/10 bg-white/60 px-3 py-2">
                    <span aria-hidden="true">{sq(results[i])}</span><span className="text-[20px]" aria-hidden="true">{r.c.flag}</span>
                    <b className="min-w-0 flex-1">{r.c.city}<span className="font-semibold text-[#6B6355]">, {r.c.country}</span></b>
                    <a href={GR.flightLink(null, r.c.code)} target="_blank" rel="noopener sponsored" className="text-[13px] font-extrabold text-[color:var(--pen)] underline underline-offset-2">Flights ↗</a>
                  </li>
                ))}
              </ol>
              <p className="mt-3 text-[13px] text-[#6B6355]">🟩 clue 1–2 · 🟨 clue 3 · 🟧 clue 4 · 🟥 clue 5 · ⬛ missed</p>
            </div>
            <div className="mt-4 flex flex-wrap gap-2">
              <button onClick={() => restart({ daily: false, seed: Math.floor(Math.random() * 1e9) })} className="btn btn-sun min-w-[12rem] flex-1 py-3 text-[17px]">🎲 {mode.daily ? "Take a bonus trip" : "Another trip"}</button>
              {!mode.daily && <button onClick={backToDaily} className="btn btn-plain min-w-[12rem] flex-1 py-3 text-[16px]">← Back to today's postcards</button>}
            </div>
          </section>
          <aside className="min-w-0 space-y-4">
            <div className="rounded-[20px] border-2 border-b-[6px] border-black bg-[color:var(--panel)] p-5">
              <div className="text-[11px] font-extrabold uppercase tracking-[.14em] text-[color:var(--muted)]">Share card</div>
              <pre className="mt-2 whitespace-pre-wrap rounded-xl bg-black/30 p-3 text-[13px] font-bold leading-relaxed" style={{ fontFamily: "ui-monospace,Menlo,Consolas,monospace" }}>{shareTxt}</pre>
              {fallback && <div className="mt-2"><div className="mb-1 text-[12px] font-bold text-[color:var(--sun)]">Copying is blocked here. The text is selected, so press Ctrl+C or ⌘+C.</div><textarea ref={taRef} readOnly value={shareTxt} rows={5} className="w-full rounded-lg bg-black/30 p-2 text-[12px]" /></div>}
              <button onClick={copy} className="btn btn-stamp mt-3 w-full py-3 text-[17px]">{copied ? "✓ Copied!" : "Copy & Send a Postcard"}</button>
              <div className="mt-4"><AdSlot w={300} h={250} size="300×250 Medium Rectangle" /></div>
            </div>
            <div className="rounded-[20px] border-2 border-black bg-[color:var(--panel)] p-4 text-center text-[13px] text-[color:var(--muted)]">New postcards in <Countdown />
              {mode.daily && <button onClick={() => restart({ daily: true, seed: 0 })} className="btn btn-plain mt-3 w-full py-2.5 text-[15px]">↺ Replay today's postcards</button>}</div>
          </aside>
        </main>
      )}
      <footer className="mt-8 text-center text-[12px] font-bold text-[color:var(--muted)]">Guess the City · a GlobeRush game</footer>
      <div className="sticky-ad md:hidden"><AdSlot w={320} h={50} size="320×50 Sticky Banner" /></div>
      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
