:root{

  --f-display:"Anton","Impact","Arial Narrow Bold",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-weight:600;font-size:15px;line-height:1.5;

.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-transform:uppercase}

h1,h2,h3{text-wrap:balance}

.btn{border-radius:16px;border:2px solid transparent;border-bottom-width:6px;font-family:var(--f-body);font-weight:900;cursor:pointer;user-select:none;transition:transform .08s,border-bottom-width .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn:disabled{cursor:default;transform:none;border-bottom-width:6px}
.btn-hot{background:var(--hot);border-color:var(--hot-d);color:#fff}
.btn-cool{background:var(--cool);border-color:var(--cool-d);color:#fff}

.chip{border-radius:999px;border:2px solid #000;border-bottom-width:4px;background:var(--bg-2);color:var(--ink)}

.take{position:relative;background:var(--card);color:var(--card-ink);border-radius:26px;border:3px solid #000;border-bottom-width:8px;overflow:hidden}
.take::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--hot),var(--amber),var(--cool))}
.quote{font-family:var(--f-display);font-size:120px;line-height:.7;color:var(--hot);opacity:.18;position:absolute;top:22px;left:14px;pointer-events:none}

.split{display:flex;height:54px;border-radius:14px;overflow:hidden;border:2px solid #000}
.split > div{display:flex;align-items:center;font-family:var(--f-display);font-size:22px;color:#fff;padding:0 12px;white-space:nowrap;transition:width .9s cubic-bezier(.2,.9,.2,1)}
@keyframes rise{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.rise{animation:rise .35s ease-out both}
@keyframes pop{0%{transform:scale(.86);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}

.flame{display:inline-block;animation:flame 1.2s ease-in-out infinite}
.ad-x{background:linear-gradient(to top right,transparent calc(50% - .5px),rgba(201,175,164,.25) 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),rgba(201,175,164,.25) 50%,transparent calc(50% + .5px)),rgba(255,255,255,.03)}

.kbd{font-family:var(--f-mono);font-size:.85em;background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.2);border-bottom-width:2px;border-radius:5px;padding:.02em .38em;white-space:nowrap}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.rise,.pop,.flame{animation:none!important}.split > div{transition:none}}
</style>

const SITE = { url: "https://skyhop.app/hot-takes" };
const AFFILIATE = {
  route:   "https://www.skyscanner.com/transport/flights/{from}/{to}/",
  toOnly:  "https://www.skyscanner.com/transport/flights-to/{to}/",
  general: "https://www.skyscanner.com/",
};
function fareLink(from, to) {
  const t = from && to ? AFFILIATE.route : to ? AFFILIATE.toOnly : AFFILIATE.general;
  const f = (from || "").trim(), d = (to || "").trim();
  return t.replace(/\{FROM\}/g, f.toUpperCase()).replace(/\{TO\}/g, d.toUpperCase()).replace(/\{from\}/g, f.toLowerCase()).replace(/\{to\}/g, d.toLowerCase());
}

const ROUND = Math.min(10, TAKES.length);
const LAUNCH = Date.UTC(2026, 9, 19);
const DAY = (() => {
  const n = new Date(), today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  return { id: Math.max(1, Math.round((today - LAUNCH) / 864e5) + 1), label: n.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) };
})();
function seeded(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function shuffle(arr, r) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const POOL = shuffle(TAKES, seeded(2468));
// Daily sets walk through the shuffled pool, so no take repeats until all have been used.
function pickSet(mode) {
  if (mode.daily) return Array.from({ length: ROUND }, (_, i) => POOL[((DAY.id - 1) * ROUND + i) % POOL.length]);
  return shuffle(POOL, seeded(mode.seed)).slice(0, ROUND);
}
// Your side vs the survey: "crowd" if most people agreed with you, "hot" if you're in the minority, "split" at 50/50.
const sideOf = (vote, t) => { const mine = vote === "A" ? t.agree : 100 - t.agree; return mine > 50 ? "crowd" : mine < 50 ? "hot" : "split"; };
const sq = s => s === "hot" ? "🔥" : s === "split" ? "⚖️" : "✅";
const SPICE = [
  { min: 7, label: "Extra Spicy", icon: "🔥🔥🔥", note: "You live in the hot seat. Your travel opinions are rare, and loud." },
  { min: 5, label: "Hot", icon: "🌶️🌶️🌶️", note: "Half the time you're with the crowd, half the time you're starting arguments." },
  { min: 3, label: "Medium", icon: "🌶️🌶️", note: "Mostly mainstream, with a few takes that would start a fight at the gate." },
  { min: 1, label: "Mild", icon: "🌶️", note: "You agree with most travelers. A crowd favorite in seat 14C." },
  { min: 0, label: "Crowd Pleaser", icon: "🧊", note: "You sided with the majority every time. Nobody's fighting you for the armrest." },
];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ---------- Sound ---------- */
let AC = null;
function tone(freqs, type = "triangle", step = .08, len = .22, vol = .1) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + .01 + i * step;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + .05);
    });
  } catch {}
}
const SFX = { crowd: () => tone([660, 880]), hot: () => tone([220, 330, 440, 660], "sawtooth", .06, .2, .05), done: () => tone([523, 659, 784, 1047], "triangle", .1, .35, .11) };

function Countdown() {
  const calc = () => { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const s = Math.max(0, Math.floor((m - n) / 1000)); return `${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };

}

function shareText(set, votes, daily) {

}

  return (
    <div className="mx-auto max-w-4xl">

      </header>

      <div className="mt-3 hidden md:block"><AdSlot w={728} h={90} size="728×90 Leaderboard" /></div>

      <div className="mt-4 flex items-center gap-3">
        <div className="flex flex-1 gap-1.5" aria-label="Progress">
          {set.map((x, i) => <span key={x.id + i} className="h-2.5 flex-1 rounded-full" style={{ background: sides[i] === "hot" ? "var(--hot)" : sides[i] ? "var(--cool)" : i === idx && !done ? "var(--amber)" : "rgba(255,255,255,.14)" }} />)}
        </div>
        <span className="mono text-[13px] text-[color:var(--muted)]">🔥 {hots}</span>
      </div>

      {!done ? (
        <main className="mt-4">
          <section key={t.id + idx} className="take rise p-6 pt-10 sm:p-9 sm:pt-12" aria-live="polite">
            <span className="quote" aria-hidden="true">“</span>
            <div className="relative text-[12px] font-black uppercase tracking-[.18em] text-[color:var(--card-muted)]">Hot take {idx + 1} of {ROUND}</div>
            <h2 className="relative mt-2 display text-[38px] sm:text-[54px] leading-[1.02]">{t.take}</h2>

            {!shown ? (
              <div className="relative mt-7 grid grid-cols-2 gap-3">
                <button onClick={() => cast("A")} className="btn btn-hot py-5 text-[20px] sm:text-[24px]">👍 Agree</button>
                <button onClick={() => cast("D")} className="btn btn-cool py-5 text-[20px] sm:text-[24px]">👎 Disagree</button>
              </div>
            ) : (
              <div className="relative mt-6 rise">
                <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
                  <span className="text-[13px] font-black uppercase tracking-[.14em] text-[color:var(--card-muted)]">You said: {vote === "A" ? "👍 Agree" : "👎 Disagree"}</span>
                  <span className="pop rounded-full px-3 py-1 text-[13px] font-black text-white" style={{ background: side === "hot" ? "var(--hot)" : side === "split" ? "var(--amber)" : "var(--ok)" }}>
                    {side === "hot" ? "🔥 HOT TAKE!" : side === "split" ? "⚖️ Dead even" : "✅ With the crowd"}
                  </span>
                </div>
                <Split agree={t.agree} vote={vote} />
                <p className="mt-3 text-[17px] font-extrabold">
                  {side === "hot" ? `Only ${mineShare}% of people see it your way.` : side === "split" ? "People are split right down the middle on this one." : `${mineShare}% of people are with you.`}
                </p>
                <p className="mt-1 text-[12px] font-semibold text-[color:var(--card-muted)]">
                  {t.pollster}{t.year ? `, ${t.year}` : ""} · {t.who}{t.source && <> · <a href={t.source} target="_blank" rel="noopener" className="underline">source</a></>}
                </p>
                <button ref={nextRef} onClick={advance} className="btn btn-amber mt-5 w-full py-3.5 text-[18px]">{idx + 1 < ROUND ? "Next hot take →" : "See my spice level →"}</button>
              </div>
            )}
          </section>
          {!shown && <p className="mt-3 text-center text-[13px] font-bold text-[color:var(--muted)]">No wrong answers. Just hot ones.</p>}
        </main>
      ) : (
        <main className="mt-4 grid gap-4 lg:grid-cols-[minmax(0,1fr)_300px]">
          <section className="take pop min-w-0 p-6 sm:p-8">
            <div className="text-[12px] font-black uppercase tracking-[.18em] text-[color:var(--card-muted)]">{mode.daily ? `Daily #${DAY.id}` : "Bonus round"} · your spice level</div>
            <div className="mt-2 flex flex-wrap items-baseline gap-x-4">
              <span className="display text-[56px] sm:text-[72px] leading-none" style={{ color: "var(--hot)" }}>{spice.label}</span>
              <span className="text-[34px]" aria-hidden="true">{spice.icon}</span>
            </div>
            <p className="mt-2 text-[17px] font-extrabold">{hots} of {ROUND} hot takes. {spice.note}</p>
            <div className="mt-4 flex flex-wrap gap-2">
              <button onClick={playBonus} className="btn btn-hot min-w-[12rem] flex-1 py-3 text-[17px]">🎲 {mode.daily ? "Play a bonus round" : "Play again"}</button>
              {!mode.daily && <button onClick={backToDaily} className="btn btn-plain min-w-[12rem] flex-1 py-3 text-[16px]">← Back to today's takes</button>}
            </div>
            {mode.daily && <p className="mt-2 text-[13px] text-[color:var(--card-muted)]">Bonus rounds are just for fun and don't change your daily result.</p>}

            <h3 className="mt-6 display text-[24px]">Your takes vs. everyone</h3>
            <ol className="mt-2 space-y-2">
              {set.map((x, i) => (
                <li key={x.id + i} className="grid grid-cols-[28px_minmax(0,1fr)_auto] items-center gap-2 rounded-2xl bg-black/[.05] px-3 py-2.5">
                  <span aria-hidden="true">{votes[i] ? sq(sides[i]) : "⬜"}</span>
                  <span className="min-w-0 text-[14px] font-bold leading-snug">{x.take}<br /><span className="text-[12px] font-semibold text-[color:var(--card-muted)]">You: {votes[i] === "A" ? "Agree" : "Disagree"} · {x.pollster} {x.year}</span></span>
                  <span className="mono text-[13px] text-right"><span style={{ color: "var(--hot-d)" }}>{x.agree}%</span> agree</span>
                </li>
              ))}
            </ol>

            <div className="mt-6 rounded-2xl border-[3px] border-b-[6px] border-black p-4 text-white" style={{ background: "linear-gradient(135deg,var(--hot),#C2410C)" }}>
              <div className="text-[10px] font-black uppercase tracking-[.18em] opacity-85">Sponsored · Fare finder</div>
              <div className="mt-1 display text-[24px] leading-tight">Our hottest take: never book without comparing fares</div>
              <a href={fareLink(null, null)} target="_blank" rel="noopener sponsored" className="btn mt-3 block w-full border-black bg-white py-3 text-center text-[16px] text-[#1D1210]">Find Cheap Flights ↗</a>
            </div>
          </section>

          <aside className="min-w-0 space-y-4">
            <div className="rounded-[24px] border-2 border-b-[6px] border-black bg-[color:var(--bg-2)] p-5">
              <div className="text-[11px] font-black uppercase tracking-[.14em] text-[color:var(--muted)]">Share card</div>
              <pre className="mt-2 whitespace-pre-wrap rounded-xl bg-black/30 p-3 mono text-[12px] leading-relaxed">{text}</pre>
              {fallback && (
                <div className="mt-2">
                  <div className="mb-1 text-[12px] font-bold text-[color:var(--amber)]">Copying is blocked here. The text is selected, so press Ctrl+C or ⌘+C.</div>
                  <textarea ref={taRef} id="share-fallback" readOnly value={text} rows={4} className="w-full rounded-lg bg-black/30 p-2 mono text-[12px]" />
                </div>
              )}
              <button onClick={copy} className="btn btn-amber mt-3 w-full py-3 text-[17px]">{copied ? "✓ Copied!" : "Copy Result"}</button>
              <div className="mt-4"><AdSlot w={300} h={250} size="300×250 Medium Rectangle" /></div>
            </div>
            <div className="rounded-[24px] border-2 border-black bg-[color:var(--bg-2)] p-4 text-center text-[13px] text-[color:var(--muted)]">
              New hot takes in <Countdown />
              {mode.daily && <button onClick={() => restart({ daily: true, seed: 0 })} className="btn btn-plain mt-3 w-full py-2.5 text-[15px]">↺ Replay today's takes</button>}
            </div>
          </aside>
        </main>
      )}

      <footer className="mt-8 text-center text-[12px] font-semibold text-[color:var(--muted)]">Travel Hot Takes prototype · percentages come from the published surveys linked on each take</footer>
      <div className="sticky-ad md:hidden"><AdSlot w={320} h={50} size="320×50 Sticky Banner" /></div>
      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
